name: Build Paperback Extension

permissions:
  contents: read
  pages: write
  id-token: write
  
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find and extract extension ZIP
        run: |
          mkdir -p build
          unzip -o ReadComicsOnlineLol-Paperback-0.8-v3.zip -d build
          echo "Extracted files:"
          find build -maxdepth 3 -type f | sort

    
      - name: Install dependencies
        working-directory: build/ReadComicsOnlineLol-Paperback-0.8
        run: npm install

      - name: Build extension
        working-directory: build/ReadComicsOnlineLol-Paperback-0.8
        run: npm run bundle

      - name: Show build output
        run: |
          echo "=== BUILD OUTPUT ==="
          find build -maxdepth 5 -type f | sort

      - name: Upload Paperback build
        uses: actions/upload-artifact@v4
        with:
          name: paperback-extension
          path: build/ReadComicsOnlineLol-Paperback-0.8
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/ReadComicsOnlineLol-Paperback-0.8

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
