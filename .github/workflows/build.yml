name: Build Paperback Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find and extract extension ZIP
        run: |
          mkdir -p build
          unzip -o ReadComicsOnlineLol-Paperback-0.8-first-build.zip -d build
          echo "Extracted files:"
          find build -maxdepth 3 -type f | sort

      - name: Install dependencies
        working-directory: build
        run: npm install

      - name: Build extension
        working-directory: build
        run: npm run bundle
