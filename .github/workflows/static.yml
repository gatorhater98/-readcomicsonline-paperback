name: Deploy Paperback Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find extension ZIP
        id: find_zip
        run: |
          echo "Repository files:"
          ls -la

          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract extension
        run: |
          mkdir -p build
          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d build

      - name: Install dependencies
        working-directory: build/ReadComicsOnlineLol-Paperback-0.8
        run: npm install

      - name: Bundle extension
        working-directory: build/ReadComicsOnlineLol-Paperback-0.8
        run: npm run bundle

      - name: Prepare Pages
        run: |
          mkdir -p pages

          # Publish the CONTENTS of bundles directly at the Pages root.
          cp -R build/ReadComicsOnlineLol-Paperback-0.8/bundles/. pages/

          echo "Pages contents:"
          find pages -maxdepth 4 -type f | sort

      - name: Verify versioning.json
        run: |
          echo "Checking generated versioning.json:"
          cat pages/versioning.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
