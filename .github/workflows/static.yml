name: Deploy Paperback Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract extension
        run: |
          mkdir -p build
          unzip -o ReadComicsOnlineLol-Paperback-0.8-first-build.zip -d build

      - name: Install dependencies
        working-directory: build/ReadComicsOnlineLol-Paperback-0.8
        run: npm install

      - name: Bundle extension
        working-directory: build/ReadComicsOnlineLol-Paperback-0.8
        run: npm run bundle

      - name: Prepare Pages
        run: |
          mkdir -p pages
          find build -maxdepth 5 -type f | sort
          cp -R build/ReadComicsOnlineLol-Paperback-0.8/* pages/ || true
          echo "Pages contents:"
          find pages -maxdepth 5 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
